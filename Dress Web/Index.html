<style>
*{box-sizing:border-box}

.rw__pin-dot::before{border-color:rgb(255 255 255/.55);animation-delay:1.3s}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.7);opacity:0}}
